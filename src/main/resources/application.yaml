spring:
  application:
    name: gateway

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-auth
              uri: ${USER_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/?(?<rest>.*), /api/v1/auth/$\{rest}
            - id: user-profile
              uri: ${USER_SERVICE_URL:http://localhost:3000}
              predicates:
                - Path=/api/users/**
              filters:
                - RewritePath=/api/users/?(?<rest>.*), /api/v1/users/$\{rest}
            - id: deal-create # DR2
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=POST
                - Path=/api/deals
            - id: deal-nearby # DR3
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=GET
                - Path=/api/deals/nearby
            - id: deal-mine # DR5
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=GET
                - Path=/api/deals/mine
            - id: deal-detail # DR4
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=GET
                - Path=/api/deals/{dealId}
            - id: deal-join # DR7
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=POST
                - Path=/api/deals/{dealId}/join
            - id: deal-leave # DR10
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=POST
                - Path=/api/deals/{dealId}/leave
            - id: deal-cancel # DR6
              uri: ${DEAL_SERVICE_URL:http://localhost:8081}
              predicates:
                - Method=DELETE
                - Path=/api/deals/{dealId}
            - id: payment
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/payments/**
            - id: stripe-webhook
              uri: ${PAYMENT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/webhooks/stripe
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:3002}
              predicates:
                - Path=/api/notifications/**

server:
  port: ${PORT:8080}

gateway:
  # Same value User Service signs tokens with. Never commit it: set JWT_SECRET in the environment.
  jwt-secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health
